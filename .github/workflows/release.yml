name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Test
        run: |
          uv sync --group dev
          uv run pytest tests/

      - name: Get version
        id: version
        run: |
          echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> $GITHUB_OUTPUT

      - name: Build sdist and wheel
        run: uv build

      # Creates the tag and a GitHub release with the built distributions attached.
      # Fails if a release for this version already exists: bump the version first.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/* \
            --target "${{ github.sha }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
